<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - WPMS</title>
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/components.css">
</head>
<body>
  <div class="app-layout">
    <main class="app-main">
      <div class="app-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md);">
          <h2 class="page-title" style="margin: 0; display: none;">Task Management</h2>
          <button id="btn-open-add-task" class="btn btn-primary" style="margin-left: auto;">Add Task</button>
        </div>
        
        <div class="toolbar">
          <input type="text" id="search-input" class="form-control" placeholder="Search tasks..." style="max-width: 300px;">
          
          <select id="filter-status" class="form-control" style="max-width: 150px;">
            <option value="All">All Status</option>
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
            <option value="Overdue">Overdue</option>
          </select>
          
          <select id="sort-by" class="form-control" style="max-width: 180px;">
            <option value="deadline-asc">Deadline (Closest)</option>
            <option value="deadline-desc">Deadline (Furthest)</option>
            <option value="priority">Priority</option>
            <option value="recent">Recently Added</option>
          </select>
        </div>

        <div id="alert-container"></div>
        
        <div id="loading-state" class="card" style="text-align: center; padding: 3rem;">
          <p style="color: var(--color-text-secondary);">Loading tasks...</p>
        </div>
        
        <div id="empty-state" class="card hidden" style="text-align: center; padding: 4rem 2rem;">
          <h2 style="margin-bottom: 1rem; font-size: 1.5rem;">No tasks found</h2>
          <p style="color: var(--color-text-secondary);">Get started by adding a new task.</p>
        </div>
        
        <div id="tasks-container" class="task-grid hidden">
          <!-- Tasks will be rendered here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add Task</h3>
        <button class="icon-btn" id="btn-close-modal" style="border: none; background: transparent;">✕</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label for="task-title" class="form-label">Title *</label>
          <input type="text" id="task-title" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="task-desc" class="form-label">Description</label>
          <textarea id="task-desc" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="task-deadline" class="form-label">Deadline *</label>
          <input type="date" id="task-deadline" class="form-control" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority" class="form-label">Priority *</label>
            <select id="task-priority" class="form-control" required>
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-status" class="form-label">Status *</label>
            <select id="task-status" class="form-control" required>
              <option value="To Do" selected>To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn btn-primary" id="btn-save-task">Save Task</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <h3 class="modal-title" style="margin-bottom: 1rem;">Delete Task</h3>
      <p style="color: var(--color-text-secondary); margin-bottom: 2rem;">Are you sure you want to delete this task? This action cannot be undone.</p>
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <button class="btn btn-danger" id="btn-confirm-delete">Delete</button>
        <button class="btn btn-secondary" id="btn-cancel-delete">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/pages/tasks.js"></script>
</body>
</html>
