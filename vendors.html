<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendors - WPMS</title>
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/components.css">
</head>
<body>
  <div class="app-layout">
    <main class="app-main">
      <div class="app-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md);">
          <h2 class="page-title" style="margin: 0; display: none;">Vendor Management</h2>
          <button id="btn-open-add-vendor" class="btn btn-primary" style="margin-left: auto;">Add Vendor</button>
        </div>
        
        <div class="toolbar">
          <input type="text" id="search-input" class="form-control" placeholder="Search vendors, services..." style="max-width: 300px;">
          
          <select id="filter-category" class="form-control" style="max-width: 150px;">
            <option value="All">All Categories</option>
            <option value="Venue">Venue</option>
            <option value="Photography">Photography</option>
            <option value="Catering">Catering</option>
            <option value="Decoration">Decoration</option>
            <option value="Makeup">Makeup</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          
          <select id="sort-by" class="form-control" style="max-width: 180px;">
            <option value="recent">Recently Added</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="category">Category</option>
            <option value="cost-desc">Cost (Highest)</option>
            <option value="cost-asc">Cost (Lowest)</option>
          </select>
        </div>

        <div id="alert-container"></div>
        
        <div id="loading-state" class="card" style="text-align: center; padding: 3rem;">
          <p style="color: var(--color-text-secondary);">Loading vendors...</p>
        </div>
        
        <div id="empty-state" class="card hidden" style="text-align: center; padding: 4rem 2rem;">
          <h2 style="margin-bottom: 1rem; font-size: 1.5rem;">No vendors found</h2>
          <p style="color: var(--color-text-secondary);">Get started by adding a new vendor.</p>
        </div>
        
        <div id="vendors-container" class="task-grid hidden">
          <!-- Vendors will be rendered here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Vendor Modal -->
  <div class="modal-overlay" id="vendor-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add Vendor</h3>
        <button class="icon-btn" id="btn-close-modal" style="border: none; background: transparent;">✕</button>
      </div>
      <form id="vendor-form">
        <input type="hidden" id="vendor-id">
        <div class="form-group">
          <label for="vendor-name" class="form-label">Vendor Name *</label>
          <input type="text" id="vendor-name" class="form-control" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="vendor-category" class="form-label">Category *</label>
            <select id="vendor-category" class="form-control" required>
              <option value="" disabled selected>Select category</option>
              <option value="Venue">Venue</option>
              <option value="Photography">Photography</option>
              <option value="Catering">Catering</option>
              <option value="Decoration">Decoration</option>
              <option value="Makeup">Makeup</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="vendor-cost" class="form-label">Estimated Cost ($)</label>
            <input type="number" id="vendor-cost" class="form-control" min="0" step="0.01">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="vendor-phone" class="form-label">Phone</label>
            <input type="tel" id="vendor-phone" class="form-control">
          </div>
          <div class="form-group">
            <label for="vendor-email" class="form-label">Email</label>
            <input type="email" id="vendor-email" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label for="vendor-service" class="form-label">Service Description</label>
          <textarea id="vendor-service" class="form-control" rows="3"></textarea>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn btn-primary" id="btn-save-vendor">Save Vendor</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <h3 class="modal-title" style="margin-bottom: 1rem;">Delete Vendor</h3>
      <p style="color: var(--color-text-secondary); margin-bottom: 2rem;">Are you sure you want to delete this vendor? This action cannot be undone.</p>
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <button class="btn btn-danger" id="btn-confirm-delete">Delete</button>
        <button class="btn btn-secondary" id="btn-cancel-delete">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/pages/vendors.js"></script>
</body>
</html>
